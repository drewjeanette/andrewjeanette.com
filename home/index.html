<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Jeanette</title>
    <meta name="description" content="Andrew Jeanette — IT Administrator for the City of Algood and Business Information Technology student at Tennessee Tech." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/home.css" />
    <script>
      // Apply theme before paint; defaults to OS preference unless the user chose one.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-fg font-sans antialiased">
    <div class="flex min-h-screen flex-col">
      <header class="mx-auto flex h-14 w-full max-w-5xl items-center justify-between px-5 md:px-8">
        <a href="/" class="flex items-center gap-2.5 text-sm font-medium">
          <span class="flex h-6 w-6 items-center justify-center rounded-md bg-fg font-mono text-[10px] font-medium text-canvas">AJ</span>
          Andrew Jeanette
        </a>
        <button
          id="theme-toggle"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
          class="flex h-8 w-8 items-center justify-center rounded-md border border-line text-muted transition-colors hover:border-line-strong hover:text-fg"
        >
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="h-[15px] w-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="hidden h-[15px] w-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </header>

      <main class="relative flex flex-1 items-center justify-center px-5 py-20">
        <div class="animate-in relative flex max-w-2xl flex-col items-center text-center">
          <img
            src="/portfolio/profile.png"
            alt="Portrait of Andrew Jeanette"
            class="h-20 w-20 rounded-2xl border border-line object-cover md:h-24 md:w-24"
          />

          <p class="mt-8 flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.12em] text-subtle">
            <span class="h-1.5 w-1.5 rounded-full bg-good"></span>
            IT Administrator · City of Algood
          </p>

          <h1 class="mt-5 text-5xl font-semibold leading-[1.02] tracking-tightest sm:text-6xl md:text-7xl">
            Andrew Jeanette
          </h1>
          <p class="mt-6 max-w-md text-lg leading-relaxed text-muted">
            Systems, networks, and security for a Tennessee city. Business IT at Tennessee Tech.
          </p>

          <div class="mt-10 flex flex-wrap justify-center gap-3">
            <a
              href="/portfolio/"
              class="group inline-flex h-10 items-center gap-2 rounded-lg bg-fg px-4 text-sm font-medium text-canvas transition-colors hover:bg-fg/85"
            >
              View portfolio
              <svg xmlns="http://www.w3.org/2000/svg" class="h-[15px] w-[15px] transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
            <a
              href="mailto:andrewjeanettebusiness@gmail.com"
              class="inline-flex h-10 items-center rounded-lg border border-line bg-canvas px-4 text-sm font-medium transition-colors hover:border-line-strong hover:bg-surface"
            >
              Get in touch
            </a>
          </div>
        </div>
      </main>

      <footer class="border-t border-line">
        <div class="mx-auto flex max-w-5xl flex-col gap-3 px-5 py-6 text-sm sm:flex-row sm:items-center sm:justify-between md:px-8">
          <p class="text-subtle">&copy; <span id="year"></span> Andrew Jeanette</p>
          <div class="flex gap-6">
            <a href="https://www.linkedin.com/in/andrew-jeanette" target="_blank" rel="noopener noreferrer" class="text-muted transition-colors hover:text-fg">LinkedIn</a>
            <a href="mailto:andrewjeanettebusiness@gmail.com" class="text-muted transition-colors hover:text-fg">Email</a>
          </div>
        </div>
      </footer>
    </div>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      // Theme toggle: swap icons + persist choice
      (function () {
        var root = document.documentElement;
        var moon = document.getElementById('icon-moon');
        var sun = document.getElementById('icon-sun');
        function syncIcons() {
          var isDark = root.classList.contains('dark');
          moon.classList.toggle('hidden', isDark);
          sun.classList.toggle('hidden', !isDark);
        }
        syncIcons();
        document.getElementById('theme-toggle').addEventListener('click', function () {
          var isDark = root.classList.toggle('dark');
          try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
          syncIcons();
        });
      })();
    </script>
  </body>
</html>
