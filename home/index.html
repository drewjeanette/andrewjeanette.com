<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Jeanette</title>
    <link rel="stylesheet" href="/home.css" />
    <script>
      // Apply theme before paint; defaults to OS preference unless the user chose one.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-in {
        animation: fadeInUp 0.6s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 antialiased transition-colors duration-300">
    <!-- Theme toggle -->
    <button
      id="theme-toggle"
      aria-label="Toggle dark mode"
      title="Toggle dark mode"
      class="fixed top-5 right-5 z-50 p-2.5 rounded-lg text-slate-500 dark:text-slate-300 bg-white/70 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 backdrop-blur hover:text-blue-600 dark:hover:text-blue-400 transition-colors shadow-sm"
    >
      <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <main class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
      <div class="animate-in flex flex-col items-center max-w-2xl">
        <div class="relative mb-8">
          <div class="absolute -inset-3 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-3xl opacity-20 blur-lg"></div>
          <img
            src="/portfolio/profile.png"
            alt="Andrew Jeanette"
            class="relative w-40 h-40 md:w-48 md:h-48 rounded-3xl object-cover border-4 border-white dark:border-slate-700 shadow-xl"
          />
        </div>

        <h1 class="text-5xl md:text-6xl font-bold tracking-tight">
          Andrew Jeanette
        </h1>
        <p class="mt-4 text-lg md:text-xl text-gray-500 dark:text-slate-400">
          IT Administrator &bull; Business Information Technology
        </p>

        <a
          href="/portfolio/"
          class="group mt-10 inline-flex items-center gap-2 rounded-xl bg-blue-600 px-8 py-4 text-lg font-semibold text-white shadow-lg shadow-blue-600/20 transition-all hover:bg-blue-700 hover:shadow-xl hover:-translate-y-0.5"
        >
          View My Portfolio
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:translate-x-1" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </a>
      </div>

      <footer class="absolute bottom-6 text-sm text-gray-400 dark:text-slate-500">
        &copy; <span id="year"></span> Andrew Jeanette. All rights reserved.
      </footer>
    </main>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      // Theme toggle: swap icons + persist choice
      (function () {
        var root = document.documentElement;
        var moon = document.getElementById('icon-moon');
        var sun = document.getElementById('icon-sun');
        function syncIcons() {
          var isDark = root.classList.contains('dark');
          moon.classList.toggle('hidden', isDark);
          sun.classList.toggle('hidden', !isDark);
        }
        syncIcons();
        document.getElementById('theme-toggle').addEventListener('click', function () {
          var isDark = root.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          syncIcons();
        });
      })();
    </script>
  </body>
</html>
