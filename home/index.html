<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andrew Jeanette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-in {
        animation: fadeInUp 0.6s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-gray-900 antialiased">
    <main class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
      <div class="animate-in flex flex-col items-center max-w-2xl">
        <div class="relative mb-8">
          <div class="absolute -inset-3 bg-gradient-to-br from-blue-500 to-indigo-500 rounded-3xl opacity-20 blur-lg"></div>
          <img
            src="/portfolio/profile.png"
            alt="Andrew Jeanette"
            class="relative w-40 h-40 md:w-48 md:h-48 rounded-3xl object-cover border-4 border-white shadow-xl"
          />
        </div>

        <h1 class="text-5xl md:text-6xl font-bold tracking-tight">
          Andrew Jeanette
        </h1>
        <p class="mt-4 text-lg md:text-xl text-gray-500">
          IT Administrator &bull; Business Information Technology
        </p>

        <a
          href="/portfolio/"
          class="group mt-10 inline-flex items-center gap-2 rounded-xl bg-blue-600 px-8 py-4 text-lg font-semibold text-white shadow-lg shadow-blue-600/20 transition-all hover:bg-blue-700 hover:shadow-xl hover:-translate-y-0.5"
        >
          View My Portfolio
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:translate-x-1" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </a>
      </div>

      <footer class="absolute bottom-6 text-sm text-gray-400">
        &copy; <span id="year"></span> Andrew Jeanette. All rights reserved.
      </footer>
    </main>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
